[project]
name = "esiosapy"
version = "3.0.2"
description = "Unofficial ESIOS API Python library. Up to date and fully equipped."
authors = [{ name = "M4RC0Sx" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["esios", "ree", "energy", "api", "electricity", "spain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
    "mypy>=1.19.1",
    "ruff>=0.15.0",
    "types-requests>=2.32.4.20260107",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.27.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.1",
    "mkdocstrings[python]>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/M4RC0Sx/esiosapy"
Documentation = "https://m4rc0sx.github.io/esiosapy/"
Repository = "https://github.com/M4RC0Sx/esiosapy"
Issues = "https://github.com/M4RC0Sx/esiosapy/issues"
Changelog = "https://github.com/M4RC0Sx/esiosapy/blob/master/CHANGELOG.md"

[project.optional-dependencies]
all = ["httpx>=0.27.0", "beautifulsoup4>=4.14.3"]
async = ["httpx>=0.27.0"]
beautifulsoup = ["beautifulsoup4>=4.14.3"]

[project.scripts]
esiosapy = "esiosapy.cli:main"

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.build-backend]
module-name = ["esiosapy"]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
unfixable = [
    "ERA", # do not autoremove commented out code
]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep
    "RUF", # ruff checks
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]
ignore = ["ERA001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
known-first-party = ["esiosapy"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.mypy]
strict = true
python_version = "3.10"
namespace_packages = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["esiosapy"]
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
