name: test
on:
    push:
      branches:
        - develop
    pull_request:
      types:
        - opened
        - synchronize

jobs:
    check-format-lint-typing:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run ruff check
              run: uv run ruff check esiosapy tests

            - name: Run format check
              run: uv run ruff format --check esiosapy tests

            - name: Run mypy
              run: uv run mypy esiosapy tests

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            matrix:
                python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
                python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run tests
              run: uv run pytest --cov=esiosapy --cov-report=xml

            - name: Debug coverage.xml
              if: matrix.python-version == '3.13'
              run: head -20 coverage.xml

            - name: Upload coverage.xml as artifact
              if: matrix.python-version == '3.13'
              uses: actions/upload-artifact@v4
              with:
                name: coverage-report
                path: coverage.xml

            - name: Upload coverage to Codecov
              if: matrix.python-version == '3.13'
              run: |
                curl -Os https://uploader.codecov.io/latest/linux/codecov
                chmod +x codecov
                ./codecov -t ${{ secrets.CODECOV_TOKEN }} -f ./coverage.xml -v
