name: test
on:
    push:
      branches:
        - develop
    pull_request:
      types:
        - opened
        - synchronize

jobs:
    linting:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run ruff check
              run: uv run ruff check

            - name: Run format check
              run: uv run ruff format --check

    typing:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run mypy
              run: uv run mypy esiosapy tests

    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run tests
              run: uv run pytest
