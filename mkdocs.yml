site_name: esiosapy
site_description: Unofficial ESIOS API Python library
site_author: M4RC0Sx
site_url: https://m4rc0sx.github.io/esiosapy/

repo_name: M4RC0Sx/esiosapy
repo_url: https://github.com/M4RC0Sx/esiosapy

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Auto
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - search.suggest
    - table of contents
  icon:
    repo: fontawesome/brands/github

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_category_heading: true
            docstring_style: sphinx

nav:
  - Home: index.md
  - API Reference: api.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/M4RC0Sx/esiosapy
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/esiosapy/
